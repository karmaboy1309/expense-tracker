<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Wallet Expense Tracker</title>
	<link rel="stylesheet" href="css/style.css" />
</head>
<body>
	<header class="site-header">
		<h1>Wallet Expense Tracker</h1>
		<p class="lead">Track your expenses locally — data stays on your device.</p>
	</header>

	<main class="container">
		<section class="panel form-panel" aria-labelledby="add-expense-heading">
			<h2 id="add-expense-heading">Add Expense</h2>
			<form id="expense-form">
				<div class="row">
					<label for="amount">Amount</label>
					<input id="amount" name="amount" type="number" step="0.01" min="0" required placeholder="0.00" />
				</div>

				<div class="row">
					<label for="category">Category</label>
					<select id="category" name="category" required>
						<option value="Food">Food</option>
						<option value="Travel">Travel</option>
						<option value="Bills">Bills</option>
						<option value="Shopping">Shopping</option>
						<option value="Other">Other</option>
					</select>
				</div>

				<div class="row">
					<label for="note">Note (optional)</label>
					<input id="note" name="note" type="text" placeholder="e.g. Lunch with Sarah" />
				</div>

				<div class="row">
					<label for="date">Date</label>
					<input id="date" name="date" type="date" />
				</div>

				<div class="row actions">
					<button type="submit" class="btn">Add Expense</button>
				</div>
			</form>
		</section>

		<section class="panel summary-panel" aria-labelledby="summary-heading">
			<h2 id="summary-heading">Wallet Summary</h2>
			<div id="wallet-panel" class="wallet-panel">
				<div class="wallet-left">
					<div class="muted">Wallet Balance</div>
					<div id="wallet-balance" class="summary-value">₹0.00</div>
				</div>
				<form id="add-funds-form" class="wallet-add" aria-label="Add funds to wallet">
					<input id="add-amount" type="number" step="0.01" min="0" placeholder="Amount" required />
					<button type="submit" class="btn">Add</button>
				</form>
			</div>
			<div class="summary-grid">
				<div class="summary-item">
					<div class="summary-value" id="today-total">₹0.00</div>
					<div class="summary-label">Today</div>
				</div>
				<div class="summary-item">
					<div class="summary-value" id="month-total">₹0.00</div>
					<div class="summary-label">This Month</div>
				</div>
				<div class="summary-item">
					<div class="summary-value" id="overall-total">₹0.00</div>
					<div class="summary-label">Overall</div>
				</div>
			</div>
		</section>

		<section class="panel list-panel" aria-labelledby="list-heading">
			<h2 id="list-heading">Expenses</h2>
			<ul id="expenses-list" class="expenses-list"></ul>
			<p id="empty-note" class="empty-note">No expenses yet.</p>
		</section>
	</main>

	<footer class="site-footer">
		<small>All data saved to your browser's localStorage.</small>
	</footer>

	<script src="js/storage.js"></script>
	<script src="js/ui.js"></script>
	<script src="js/app.js"></script>
</body>
</html>
